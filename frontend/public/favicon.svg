<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="16" fill="#0B132B" />
  <!-- Glowing Hexagonal Outer Shield -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="none" stroke="url(#tx-grad)" stroke-width="3" stroke-linejoin="round" />
  <!-- Compass / Trade Coordinates Cross -->
  <path d="M 32 16 L 32 48 M 16 32 L 48 32" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4" />
  <!-- Central Diamond / Node Core -->
  <polygon points="32,22 42,32 32,42 22,32" fill="url(#tx-grad)" />
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
</svg>
