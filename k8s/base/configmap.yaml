apiVersion: v1
kind: ConfigMap
metadata:
  name: tradex-config
  namespace: tradex
data:
  ENV: "development"
  PROJECT_NAME: "TradeX AI"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  CORS_ORIGINS: "https://localhost,http://localhost"
  LOCAL_STORAGE_PATH: "/app/storage"
  MAX_UPLOAD_SIZE_MB: "10"
  STORAGE_BACKEND: "local"
  AI_PROVIDER: "groq"
  AI_MODEL: "llama-3.3-70b-versatile"
  AI_PROVIDER_PRIORITY: "groq,ollama,gemini"
  AI_TIMEOUT_SECONDS: "30"
  WORKER_INLINE: "true"
  EMBEDDINGS_ENABLED: "false"
  DEMO_MODE: "true"
  VITE_DEMO_LOGIN: "false"
