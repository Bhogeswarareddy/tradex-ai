services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pg_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradex}
      POSTGRES_USER: ${POSTGRES_USER:-tradex_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradex_user} -d ${POSTGRES_DB:-tradex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    restart: unless-stopped

  migrate:
    image: ${ECR_REGISTRY:-tradex-ai}/backend:${IMAGE_TAG:-latest}
    container_name: tradex_migrate
    command: ["/bin/bash", "/app/scripts/migrate-and-seed.sh"]
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - uploads:/app/storage
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${ECR_REGISTRY:-tradex-ai}/backend:${IMAGE_TAG:-latest}
    container_name: fastapi_app
    environment:
      ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY}
      LOCAL_STORAGE_PATH: /app/storage
    volumes:
      - uploads:/app/storage
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY:-tradex-ai}/frontend:${IMAGE_TAG:-latest}
    container_name: react_app
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  nginx:
    image: ${ECR_REGISTRY:-tradex-ai}/nginx:${IMAGE_TAG:-latest}
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
      - uploads:/app/storage:ro
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  pgdata:
    name: tradex_pgdata
  uploads:
    name: tradex_uploads
  nginx_logs:
    name: tradex_nginx_logs
  certs:
    name: tradex_certs
