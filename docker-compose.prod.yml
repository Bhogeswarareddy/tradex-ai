services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tradex-prod-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradex-prod-backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic_fallback}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      LOCAL_STORAGE_PATH: /app/storage
    volumes:
      - storage_data_prod:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    container_name: tradex-prod-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata_prod:
    name: tradex_prod_pgdata
  storage_data_prod:
    name: tradex_prod_storage
