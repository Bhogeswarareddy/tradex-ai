apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradex-backend
  labels:
    app: tradex-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tradex-backend
  template:
    metadata:
      labels:
        app: tradex-backend
    spec:
      containers:
        - name: backend
          image: bhogeswara/tradex-ai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENV
              value: "development"
            - name: PORT
              value: "8000"
            - name: AI_PROVIDER
              value: "mock"
            - name: WORKER_INLINE
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
