global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "tradex-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["fastapi_app:8000"]
        labels:
          app: "tradex-ai"
          environment: "production"
          service: "backend"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
